<div class="min-h-screen flex items-center justify-center bg-slate-100">
  <form class="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm space-y-4" (ngSubmit)="onSubmit()" autocomplete="off">
    <h1 class="text-2xl font-bold text-slate-800">Đăng nhập</h1>

    @if (error()) {
      <div class="bg-red-50 text-red-600 border border-red-200 rounded-lg p-3 text-sm">
        {{ error() }}
      </div>
    }

    <div>
      <label class="block text-sm text-slate-600 mb-1">Email</label>
      <input type="email" [(ngModel)]="email" name="email" autocomplete="off" class="w-full border rounded px-3 py-2" />
    </div>

    <div>
      <label class="block text-sm text-slate-600 mb-1">Mật khẩu</label>
      <input type="password" [(ngModel)]="password" name="password" autocomplete="off" class="w-full border rounded px-3 py-2" />
    </div>

    <button
      type="submit"
      [disabled]="loading()"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 disabled:opacity-50"
    >
      {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>
</div>
