<!-- Overlay tối mờ khi mở sidebar trên mobile -->
@if (ui.sidebarOpen()) {
  <div class="fixed inset-0 bg-black/50 z-20 md:hidden" (click)="ui.toggleSidebar()"></div>
}

<aside
  class="fixed md:static inset-y-0 left-0 z-30 w-64 h-screen bg-slate-900 text-white p-4 flex flex-col gap-2 transition-transform duration-200 md:translate-x-0"
  [class.-translate-x-full]="!ui.sidebarOpen()"
>
  <h2 class="text-xl font-bold mb-6">Finance App</h2>
  <a routerLink="/" routerLinkActive="bg-slate-700" [routerLinkActiveOptions]="{exact: true}"
     class="px-3 py-2 rounded hover:bg-slate-700 cursor-pointer">Dashboard</a>
  <a routerLink="/transactions" routerLinkActive="bg-slate-700"
     class="px-3 py-2 rounded hover:bg-slate-700 cursor-pointer">Giao dịch</a>
  <a routerLink="/reports" routerLinkActive="bg-slate-700"
     class="px-3 py-2 rounded hover:bg-slate-700 cursor-pointer">Báo cáo</a>
</aside>
